name: Build kimai container

on:
  push:
    branches:
      vusdx-install-changes
  workflow_dispatch:

env:
  IMAGE_NAME: kimai2-app-service

jobs:
  build:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Checkout KimaiCapacityPlanning
        uses: actions/checkout@v4
        with: 
          repository: VUSdx/KimaiCapacityPlanning
          path: var/plugins/BiotechPlannerBundle
          token: ${{ secrets.GH_PAT }}

      - name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_ENDPOINT }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          file: Dockerfile
          target: prod
          tags: ${{ vars.ACR_ENDPOINT }}/${{ env.IMAGE_NAME }}
          build-args: |
            BASE=apache